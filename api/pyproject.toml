[project]
name = "mikey-nba-api"
version = "0.1.0"
description = "A small NBA API that serves its own copy of balldontlie data."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",      # used by scripts/fetch_snapshot.py
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "invariant: rules that must hold for any data set (the future Nightly Check runs these)",
]
